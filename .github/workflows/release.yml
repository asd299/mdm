name: Release APK

# 推送 v* 标签即自动构建、签名并创建 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          set -euo pipefail
          OUT="MisterDownloadManager-Android-${GITHUB_REF_NAME}.apk"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks key/mdm-release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$OUT" \
            aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mister 下载管理器 ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.APK }}
          generate_release_notes: true
          body: |
            ## 下载

            - `MisterDownloadManager-Android-${{ github.ref_name }}.apk`：直接安装（已签名，可覆盖升级）
            - 需要 Android 7.0 (API 24) 及以上

            ## 本次更新

            - 列表支持下拉刷新：重新读取任务记录，不打断正在下载的任务
            - 侧边栏「任务」与「按类型分类」拆成两个独立维度，默认都是「全部」，可组合筛选（如「已完成 + 视频」）
            - 全新应用图标（暗紫极光 + M 品牌符号），侧边栏顶部同步使用同一图标
            - 修复上一版侧边栏图标与桌面图标不一致的问题

            签名证书 SHA-256：`44:05:EE:13:56:C4:7A:DF:95:4F:A1:89:BB:BD:62:C0:45:32:8F:66:F7:98:A5:4C:8E:95:0A:70:BC:D1:9F:86`
