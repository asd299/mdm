name: Release APK

# 推送 v* 标签即自动构建、签名并创建 GitHub Release
on:
  push:
    tags:
      - "v*"
  # 允许在 Actions 页面手动重跑（标签已存在时也能补发）
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/补发的标签，例如 v1.6.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 标签触发时用标签名；手动触发时用输入的标签
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        id: sdk
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        id: platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build release APK
        id: build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        id: sign
        run: |
          set -euo pipefail
          OUT="MisterDownloadManager-Android-${RELEASE_TAG}.apk"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks key/mdm-release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$OUT" \
            aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          name: Mister 下载管理器 ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.APK }}
          generate_release_notes: true
          body: |
            ## 下载

            - `MisterDownloadManager-Android-${{ env.RELEASE_TAG }}.apk`：直接安装（已签名，可覆盖升级）
            - 需要 Android 7.0 (API 24) 及以上

            ## 本次更新

            - 列表支持下拉刷新：重新读取任务记录，不打断正在下载的任务
            - 侧边栏「任务」与「按类型分类」拆成两个独立维度，默认都是「全部」，可组合筛选（如「已完成 + 视频」）
            - 全新应用图标（暗紫极光 + M 品牌符号），侧边栏顶部同步使用同一图标
            - 修复上一版侧边栏图标与桌面图标不一致的问题

            签名证书 SHA-256：`44:05:EE:13:56:C4:7A:DF:95:4F:A1:89:BB:BD:62:C0:45:32:8F:66:F7:98:A5:4C:8E:95:0A:70:BC:D1:9F:86`

      # 构建结果回写为轻量标签，便于在无 API 权限时确认流水线是否真的跑过
      # 标签注释里带每个步骤的结果，失败时可直接定位是哪一步挂的
      - name: Report pipeline status
        if: always()
        continue-on-error: true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set -e
          TAG="ci/${RELEASE_TAG}-${{ job.status }}"
          SUMMARY="$(printf '%s' "$STEPS_JSON" | jq -r 'to_entries[] | "\(.key):\(.value.outcome // .value.conclusion // "?")"' | tr '\n' ' ')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG" -m "status=${{ job.status }} ${SUMMARY}" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
